[package]
name = "lumina"
version = "0.1.9"
description = "A lightweight League of Legends companion built on the LCU and SGP APIs"
authors = ["Yessi-cmd"]
license = "MIT"
repository = "https://github.com/Yessi-cmd/lumina"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
# LCU serves a certificate chained to Riot's 2013 v1/SHA-1 root, which webpki rejects,
# so LCU traffic goes through SChannel via native-tls.
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Window placement of the League client, for the champ-select overlays.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
